<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Gambar Neptunus</title>
    <link rel="icon" type="image/jpeg?width=500" href="neptune.jpeg">
    <style>
        /* style.css */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
            /* Mencegah scroll horizontal */
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 50px;
        }

        .gallery img {
            width: 30%;
            margin: 10px;
            transition: transform 0.3s ease;
            /* Transisi untuk animasi hover */
            border: 5px solid #fff;
            /* Bingkai putih */
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);
            /* Efek bayangan */
        }

        .gallery img:hover {
            transform: scale(1.1);
            /* Efek zoom saat dihover */
            border-color: #0f0;
            /* Warna bingkai berubah saat dihover */
        }
    </style>
</head>

<body>
    <div class="gallery">
        <img src="https://media.istockphoto.com/id/1224367913/id/vektor/peta-infografis-planet-tata-surya-galaksi.jpg?s=2048x2048&w=is&k=20&c=F0dumQ4QY5b2OlyxV0wbfx_UOQxEFpuFuO7na5vATUQ=" alt="Gambar Neptunus 1">
        <img src="https://kajiangeografi.wordpress.com/wp-content/uploads/2018/10/43f88-screenshot_5.jpg" alt="Gambar Neptunus 2">
        <img src="https://nusantaraterkini.co/uploads/images/202402/image_870x_65d9e009c5a32.jpg" alt="Gambar Neptunus 3">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSeWugeGIKXhvVr_uUXKAG_-Wej8_wEmm7hzQ&s" alt="Gambar Neptunus 4">
        <img src="https://awsimages.detik.net.id/community/media/visual/2020/11/18/ilustrasi-planet-uranus-1.jpeg?w=600&q=90" alt="Gambar Neptunus 5">
        <img src="https://img.freepik.com/premium-photo/photo-zoom-texture-neptunus-planet-with-blue-black-color_626849-4815.jpg" alt="Gambar Neptunus 6">
        <img src="" alt="Gambar Neptunus 7">
        <img src="" alt="Gambar Neptunus 8">
        <img src="" alt="Gambar Neptunus 9">
    </div>
</body>

</html>
